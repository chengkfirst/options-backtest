[pytest]
markers =
    req(id): the architecture document requirement this test claims to cover
    kind(name): what a failure here means — see tests/kinds.py
    layer(name): which architecture layer it belongs to
    timing: asserts wall-clock time, so it measures the machine as well as the code.
        Runs locally, where the figures it guards were measured. The blocking CI job
        deselects it with `-m "not timing"` and a non-blocking step prints the
        durations instead — see TestTheFileSourceIsUsableOnRealVolumes.
