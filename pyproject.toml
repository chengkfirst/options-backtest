[project]
name = "backtest"
version = "0.1.0"
description = "A research platform for backtesting US equity option strategies"
# Capped, not open-ended: numpy 1.26.4 and pandas 2.1.4 publish no wheels for
# 3.13, and the pins are not changing. ">=3.11" let a 3.13 interpreter satisfy
# the declaration and then fail at install, which reads as a broken project
# rather than an unsupported interpreter.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "scipy==1.13.0",
    "pyarrow==14.0.2",
    "yfinance==1.4.1",
    "pandas-market-calendars==5.4.0",
    # A run config is a file. Pinned like the rest: an unpinned parser is one more thing
    # that can read the same file differently on two machines.
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
# pypdf is here rather than in an extra of its own, and the reason is a guard that was
# dark. tests/test_plan_details.py reads every figure out of the architecture PDF behind
# `pytest.importorskip("pypdf")`, so wherever pypdf was absent that check skipped -- and a
# skip prints no differently from a pass in a summary. It was in a `docs` extra nobody
# installs, so the guard was quiet in CI and quiet on any fresh clone.
#
# Pinned like the rest: the conversion reads font sizes and glyph positions, so a
# different extractor version could read the same PDF differently.
dev = ["pytest==7.4.0", "pypdf==6.16.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
