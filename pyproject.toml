[project]
name = "backtest"
version = "0.1.0"
description = "A research platform for backtesting US equity option strategies"
# Capped, not open-ended: numpy 1.26.4 and pandas 2.1.4 publish no wheels for
# 3.13, and the pins are not changing. ">=3.11" let a 3.13 interpreter satisfy
# the declaration and then fail at install, which reads as a broken project
# rather than an unsupported interpreter.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "scipy==1.13.0",
    "pyarrow==14.0.2",
    "yfinance==1.4.1",
    "pandas-market-calendars==5.4.0",
    # A run config is a file. Pinned like the rest: an unpinned parser is one more thing
    # that can read the same file differently on two machines.
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = ["pytest==7.4.0"]
# Only tools/pdf_to_md.py needs this, and only when a plan PDF has changed. Pinned
# like the rest: the conversion reads font sizes and glyph positions, so a different
# extractor version could silently read the same PDF differently.
docs = ["pypdf==6.16.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
