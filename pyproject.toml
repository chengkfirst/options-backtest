[project]
name = "backtest"
version = "0.1.0"
description = "A research platform for backtesting US equity option strategies"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "scipy==1.13.0",
    "pyarrow==14.0.2",
    "yfinance==1.4.1",
    "pandas-market-calendars==5.4.0",
]

[project.optional-dependencies]
dev = ["pytest==7.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
