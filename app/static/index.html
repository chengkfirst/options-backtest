<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Options Bench</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!-- tokens first: it defines every value the three below use, and it is the only file
     allowed to contain a colour. shell.css is last so the frame can adjust the bench's
     full-height layout without editing it. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="bench.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/run.css">

<div class="shell">

<!-- The rail is generated from the surface table in js/app.js, so a surface cannot exist
     without a way to reach it, or appear in the rail without existing. -->
<nav class="rail" id="rail" aria-label="surfaces"></nav>

<div class="frame">

  <header class="topbar">
    <button class="icon-btn" id="railToggle" type="button" title="widen the rail"
            aria-label="widen the rail">&#9776;</button>
    <h1>Options Bench</h1>
    <!-- The mode badge belongs in the top context bar (the design plan's section 4), not
         in the panel: it describes the service, not the strategy being composed. It was
         in the panel head beneath a second copy of the page title. -->
    <p class="mode" id="mode">connecting…</p>
    <div class="topbar-right">
      <span class="job-strip" id="jobStrip" hidden></span>
      <button class="chip" id="theme" type="button"></button>
    </div>
  </header>

  <!-- The problem strip: every error and every skipped thing, for every surface. -->
  <div class="issues" id="issues" hidden></div>

  <!-- ══ the bench ══ -->
  <section class="bench" id="view-bench">

<!-- ══ left: the rule itself ══

     This was a form: seven slot cards, a variant picker per slot and a generated control
     per parameter. It is a text document now, and the document is the exact payload the
     engine receives — no field is translated on the way out and none is filled in when
     omitted, so what is on screen is what ran.

     The form was the wrong shape for the work. A researcher who already knows what rule
     they want to test does not want to be walked through seven dropdowns to say it, and a
     dropdown can only offer the rules someone anticipated: the engine orders contracts by
     target delta, so a delta slider quietly answers "which contract" with the only answer
     it has, whatever rule was actually intended. A document can hold the rule as written
     and the interface can say where the engine falls short of it, which is the honest
     version of the same screen. -->
<aside class="panel">
  <div class="panel-body">
    <label class="sb grow rule-name">name
      <input type="text" id="ruleName" value="untitled" spellcheck="false"
             autocomplete="off"></label>

    <div class="rule-wrap">
      <textarea id="ruleText" class="code rule-text" spellcheck="false"
                autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <p class="rule-state" id="ruleState"></p>

    <details class="ref">
      <summary>signals available to the entry expression<span class="ref-n" id="sigCount"></span></summary>
      <input type="search" id="sigSearch" placeholder="name or meaning" class="ref-search">
      <div id="sigRef" class="sig-ref"></div>
    </details>

    <details class="ref" id="tradeoffRef">
      <summary>contract selection, that day's real chain<span class="ref-n" id="toWhen"></span></summary>
      <div id="tradeoffBody" class="to-body"></div>
    </details>
  </div>

  <div class="panel-foot">
    <button class="run" id="run">run</button>
    <p class="hint" id="runHint"></p>
  </div>
</aside>

<!-- ══ right: the rules that have been saved, and the runs made from them ══ -->
<main class="stage">

  <!-- What the document asks for that the engine cannot do. Derived from the document,
       not a fixed list: silence here means nothing was detected, not that nothing is
       wrong. It sits here rather than under the editor because a rule of any size is
       taller than the panel, and this is the part that has to be read before pressing
       run, not after scrolling to find it. -->
  <section class="runs rule-gaps" id="ruleGaps" hidden></section>

  <section class="runs" id="savedSec" hidden>
    <div class="runs-head"><h2>saved rules</h2></div>
    <div class="scroll"><table id="saved"></table></div>
  </section>

  <section class="runs" id="runsSec" hidden>
    <div class="runs-head"><h2>runs in this session</h2></div>
    <div class="scroll"><table id="runs"></table></div>
  </section>

  <div class="placeholder" id="placeholder">
    <h2>nothing run yet</h2>
    <p>Write the rule on the left, or click a saved one to load it.</p>
    <p class="hint" id="gapList" hidden></p>
  </div>
</main>
  </section>

  <!-- ══ run analysis: the design plan's section 6, in three tiers ══ -->
  <section id="view-run" hidden></section>

  <!-- ══ a surface the backend cannot answer yet ══ -->
  <section class="pending" id="view-pending" hidden>
    <div id="pendingBody"></div>
  </section>

</div><!-- /frame -->
</div><!-- /shell -->

<script type="module" src="js/app.js"></script>
