<!--
  The component and state gallery.

  The design plan (section 13) asks for Storybook: every component shipped with all of its
  states, and design review done on the running interface rather than on mockups. This
  project has no npm and no build step — the service is the Python standard library and
  the page loads its modules directly — so Storybook is replaced by this page, which keeps
  the part that matters: **it imports the real modules and renders the real components**,
  so what is reviewed here is what ships. The deviation is recorded in the frontend plan.

  What belongs here: every component, in every state from the plan's section 11, plus the
  token palette with the contrast decisions visible. What does not: a second
  implementation of anything. If something can only be shown here by reimplementing it,
  the component is too entangled with its page and that is the finding.
-->
